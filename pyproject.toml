[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tanvo"
version = "0.1.0"
description = "Python client for Tanvo: AI images, video and songs on Nano Banana, Seedream, GPT Image, Veo, Kling, Seedance and Suno, plus 80 ready-made photo apps. No dependencies; the house image engine works without an API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Tanvo", email = "support@tanvo.ai" }]
keywords = ["tanvo", "ai image generator", "ai video generator", "text to image", "image to video", "text to video", "ai music", "nano banana", "seedream", "kling", "veo", "seedance", "suno", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://tanvo.ai/?utm_source=pypi&utm_medium=referral"
Documentation = "https://github.com/tanvoai/tanvo-python#readme"
Repository = "https://github.com/tanvoai/tanvo-python"
Issues = "https://github.com/tanvoai/tanvo-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tanvo"]
